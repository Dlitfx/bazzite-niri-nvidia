---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: niri-bazzite
# description will be included in the image's metadata
description: This is my personal OS image.Bazzite 底层 + niri/Noctalia 桌面层

# the base image to build on top of (FROM) and the version tag to use
#base-image: ghcr.io/ublue-os/silverblue-main
#base-image: ghcr.io/ublue-os/base-nvidia
base-image: ghcr.io/ublue-os/bazzite-nvidia-open
image-version: stable # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module

modules:
  - type: dnf
    repos:
      cleanup: true
      copr:
        - yalter/niri            # 官方，非个人
    install:
      packages:
        - niri
        - xwayland-satellite
        - noctalia               # Fedora 官方源
        - umbriel                # 可选，替代 SDDM
        - xdg-desktop-portal-umbriel
        - fuzzel
        - kitty
        - nemo
        - udiskie
        - xdg-user-dirs
        - power-profiles-daemon
        - gnome-keyring-pam
        - bibata-cursor-themes
        - adw-gtk3-theme
      exclude:
        - alacritty
        - waybar
        - mako
        - swaylock

  # 输入法：整族替换
  - type: dnf
    repos:
      cleanup: true
    install:
      packages:
        - fcitx5
        - fcitx5-chinese-addons
        - fcitx5-rime
        - librime-lua
        - librime-octagram
        - fcitx5-gtk
        - fcitx5-qt
        - fcitx5-configtool
    remove:
      packages:
        - ibus
        - ibus-gtk3
        - ibus-gtk4
        - ibus-libs
        - ibus-setup

  - type: dnf   # 中文字体与语言包
    repos:
      cleanup: true
    install:
      packages:
        - default-fonts-cjk-sans
        - google-noto-sans-cjk-vf-fonts
        - google-noto-color-emoji-fonts
        - fira-code-fonts
        - glibc-all-langpacks
        - langpacks-zh_CN
        - langpacks-fonts-zh_CN

  - type: signing
